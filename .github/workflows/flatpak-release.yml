name: Flatpak Release

run-name: Flatpak ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, such as 2026.11.24'
        required: true
        type: string
      ref:
        description: 'Branch, tag or commit to build'
        required: true
        default: 'master'
        type: string
      publish:
        description: 'Create a GitHub release with the bundle'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: flatpak-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build x86_64 bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    env:
      APP_ID: io.github.jmalcolm137.LadybirdSDE
      BUNDLE: LadybirdSDE-${{ inputs.version }}-x86_64.flatpak
      MANIFEST: Meta/CMake/flatpak/io.github.jmalcolm137.LadybirdSDE.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The image bakes a Flatpak installation into a read-only layer. Copy it to
      # the writable layer so updates can rename deployments (the upstream build
      # does the same).
      - name: Make the baked-in Flatpak installation writable
        run: |
          cp -a /var/lib/flatpak /var/lib/flatpak.rw
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.rw /var/lib/flatpak

      - name: Fetch pinned sources
        run: ./scripts/fetch-flatpak-sources.sh

      - name: Set release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re

          version = os.environ['VERSION']

          path = 'Meta/CMake/flatpak/io.github.jmalcolm137.LadybirdSDE.json'
          with open(path) as file:
              manifest = json.load(file)
          ladybird = next(module for module in manifest['modules'] if module['name'] == 'Ladybird')
          ladybird['config-opts'].append(f'-DLADYBIRD_VERSION={version}')
          with open(path, 'w') as file:
              json.dump(manifest, file, indent=4)
              file.write('\n')

          path = 'Meta/CMake/flatpak/sde/io.github.jmalcolm137.LadybirdSDE.metainfo.xml'
          with open(path) as file:
              metainfo = file.read()
          metainfo = re.sub(
              r'<release version="[^"]*" date="[^"]*"/>',
              f'<release version="{version}" date="{datetime.date.today().isoformat()}"/>',
              metainfo,
          )
          with open(path, 'w') as file:
              file.write(metainfo)
          PY

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.BUNDLE }}
          manifest-path: ${{ env.MANIFEST }}
          arch: x86_64
          branch: stable
          cache: false
          upload-artifact: false

      - name: Checksum
        run: sha256sum "$BUNDLE" > "$BUNDLE.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: LadybirdSDE-x86_64
          path: |
            ${{ env.BUNDLE }}
            ${{ env.BUNDLE }}.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    env:
      APP_ID: io.github.jmalcolm137.LadybirdSDE
      BUNDLE: LadybirdSDE-${{ inputs.version }}-x86_64.flatpak
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: LadybirdSDE-x86_64
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cd dist
          tag="sde-$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$BUNDLE" "$BUNDLE.sha256" --clobber
          else
            cat > release-notes.md <<EOF
          Source-built Flatpak of the LibGUI Ladybird SDE frontend.

          - App id: \`$APP_ID\` (installs alongside upstream \`org.ladybird.Ladybird\`)
          - Runtime: \`org.freedesktop.Platform//26.08\` (x86_64)
          - Built with flatpak-builder from \`${{ inputs.ref }}\` at \`${{ github.sha }}\`

          ## Install

          \`\`\`sh
          flatpak install --user ./$BUNDLE
          flatpak run $APP_ID
          \`\`\`
          EOF
            gh release create "$tag" "$BUNDLE" "$BUNDLE.sha256" \
              --target "${{ github.sha }}" \
              --title "Ladybird SDE Flatpak $VERSION" \
              --notes-file release-notes.md
          fi
